name: judge0-python

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 50m
      max-file: "5"

services:
  server:
    image: judge0/judge0:1.13.1
    container_name: judge0-python-server
    restart: unless-stopped
    privileged: true
    env_file: ./config/judge0.conf
    volumes:
      - ./config/judge0.conf:/judge0.conf:ro
    ports:
      # Docker 在该服务器上无法为指定宿主 IP 创建监听；由 UFW 按来源网段收口。
      - "0.0.0.0:2358:2358"
    networks:
      - judge0_internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    <<: *default-logging

  workers:
    image: judge0/judge0:1.13.1
    container_name: judge0-python-workers
    command: ["./scripts/workers"]
    restart: unless-stopped
    privileged: true
    env_file: ./config/judge0.conf
    volumes:
      - ./config/judge0.conf:/judge0.conf:ro
    networks:
      - judge0_internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 4g
    cpus: 3.0
    pids_limit: 768
    <<: *default-logging

  db:
    image: postgres:16.2
    container_name: judge0-python-db
    restart: unless-stopped
    env_file: ./config/judge0.conf
    volumes:
      - judge0_postgres_data:/var/lib/postgresql/data
    networks:
      - judge0_internal
    mem_limit: 1g
    cpus: 0.75
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    <<: *default-logging

  redis:
    image: redis:7.2.4
    container_name: judge0-python-redis
    command: ["bash", "-c", "docker-entrypoint.sh --appendonly yes --appendfsync everysec --requirepass \"$$REDIS_PASSWORD\""]
    restart: unless-stopped
    env_file: ./config/judge0.conf
    volumes:
      - judge0_redis_data:/data
    networks:
      - judge0_internal
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 96
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    <<: *default-logging

networks:
  judge0_internal:
    name: judge0_python_internal
    driver: bridge

volumes:
  judge0_postgres_data:
    name: judge0_python_postgres_data
  judge0_redis_data:
    name: judge0_python_redis_data
