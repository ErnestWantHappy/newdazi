server {
    listen 80;
    listen [::]:80;
    server_name office.xsedu.net.cn office-sandbox.xsedu.net.cn;

    client_max_body_size 60m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # 平台通过 xxkj 域名嵌入 Integration iframe；上游策略只允许 CryptPad 自身，需补充平台来源。
    proxy_hide_header Content-Security-Policy;
    # CryptPad 的 Office 集成会在主域和 sandbox 域之间加载 iframe、Worker 与 Wasm；覆盖上游 CSP 时必须完整保留这些运行来源。
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline' 'self' http://office.xsedu.net.cn http://office-sandbox.xsedu.net.cn; font-src 'self' data: http://office.xsedu.net.cn http://office-sandbox.xsedu.net.cn; child-src 'self' blob: http://office.xsedu.net.cn http://office-sandbox.xsedu.net.cn; frame-src 'self' blob: http://office.xsedu.net.cn http://office-sandbox.xsedu.net.cn; connect-src 'self' blob: http://office.xsedu.net.cn http://office-sandbox.xsedu.net.cn ws://office.xsedu.net.cn ws://office-sandbox.xsedu.net.cn; img-src 'self' data: blob: http://office.xsedu.net.cn http://office-sandbox.xsedu.net.cn; media-src blob:; frame-ancestors 'self' http://office.xsedu.net.cn http://xxkj.xsedu.net.cn http://10.52.1.123:3010; worker-src 'self' blob: http://office.xsedu.net.cn http://office-sandbox.xsedu.net.cn; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' resource: blob: http://office.xsedu.net.cn http://office-sandbox.xsedu.net.cn" always;

    location /cryptpad_websocket {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }
}
