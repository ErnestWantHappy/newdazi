<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>学业测评平台</title>
    <style>
        :root {
            --bg1: #e8f1fb;
            --bg2: #f7fbff;
            --ink: #163a63;
            --muted: #6b7c93;
            --btn: #1b6fd4;
            --btn-hover: #1557a8;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
            font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(1200px 500px at 50% -10%, #cfe4fb 0%, transparent 60%),
                linear-gradient(180deg, var(--bg1), var(--bg2));
        }
        .wrap {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 560px;
            text-align: center;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 280px;
            min-height: 56px;
            padding: 14px 28px;
            border: 0;
            border-radius: 14px;
            background: var(--btn);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            line-height: 1.4;
            text-decoration: none;
            box-shadow: 0 10px 24px rgba(27, 111, 212, 0.28);
        }
        .entry {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: inherit;
        }
        .btn:hover { background: var(--btn-hover); }
        .note {
            margin: 16px 0 0;
            font-size: 13px;
            color: var(--muted);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <a class="entry" href="http://10.52.1.130" target="_blank" rel="noopener noreferrer">
                <span class="btn">点击跳转到信息科技学业测评平台</span>
                <span class="note">0909日更新最新版</span>
            </a>
        </div>
    </div>
</body>
</html>
