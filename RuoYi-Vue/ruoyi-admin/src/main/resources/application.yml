# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.0
  # 版权年份
  copyrightYear: 2025
  # 文件路径 使用相对路径，相对于项目运行目录
  profile: ./uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math
  # LibreOffice 转换服务配置
  libre-office:
    home: C:\Program Files\LibreOffice
    instance-count: 5
    # 每个实例通常有 soffice + soffice.bin，5 实例常态约 10 进程；
    # 阈值过低会在高峰误触发整池重建，导致 converting 任务卡住。
    # 按「实例数×4 + 余量」：5×4+5=25，避免正常并发被误杀。
    process-warn-threshold: 25
    # 每实例处理 N 个任务后回收进程；过小会在 100～200 并发中途整池轮换卡住
    # 县考高峰单波可达数百份，提到 200 减少中途回收
    max-tasks-per-process: 200
    task-execution-timeout: 300000
    task-queue-timeout: 120000
    process-timeout: 120000
    max-retry: 1
    # 方案 B 自愈：连续服务级失败达到阈值才主动重建（配合分钟级健康巡检）
    failure-threshold: 3
    # 两次整池重建最小间隔，防止抖动反复杀池（毫秒）
    rebuild-cooldown-ms: 120000
    # 在途转换挂起超过该时间视为半死信号；应明显小于 task-execution-timeout
    soft-hang-timeout-ms: 120000
  # 操作题预览转换队列：交卷与预览解耦，高峰只排队不拖垮提交
  conversion:
    queue-capacity: 800
    # 领取 pending→converting 的调度池（不做 LibreOffice）
    dispatch-core-size: 10
    dispatch-max-size: 20
    dispatch-queue-capacity: 2000

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    # 生产高并发下 DEBUG 会放大日志 I/O，需要排障时再通过外置配置临时开启。
    com.ruoyi: info
    # 导学单 JSON 含学生答卷和评分配置，禁止作为 MyBatis SQL 参数写入日志
    com.ruoyi.business.mapper.GuideSheetAnswerMapper: info
    com.ruoyi.business.mapper.GuideSheetBindingMapper: info
    com.ruoyi.business.mapper.GuideSheetDraftMapper: info
    com.ruoyi.business.mapper.GuideSheetMapper: info
    com.ruoyi.business.mapper.GuideSheetProgressMapper: info
    com.ruoyi.business.mapper.GuideSheetUploadMapper: info
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 55MB
      # 设置总上传的文件大小
      max-request-size: 60MB
  # 服务模块
  devtools:
    restart:
      # LibreOffice 进程池无法安全热重启，避免开发态后端卡在销毁阶段
      enabled: false
  # redis 配置
  redis:
    # 地址
    host: localhost
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码
    password:
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

management:
  health:
    ldap:
      # 当前项目未依赖 LDAP 健康状态作为启动前提，关闭以避免本地环境误报
      enabled: false

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（分钟）
  expireTime: 120

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: ${SWAGGER_ENABLED:false}
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 学生提交配置。课程推进后保留短暂补交窗口，当前课仍会立即切换。
student:
  submission-grace-minutes: ${STUDENT_SUBMISSION_GRACE_MINUTES:15}

# Swagger 示例接口默认不注册，仅本机显式开启。
demo:
  enabled: ${DEMO_ENABLED:false}

# WPS WebOffice 在线协作 PoC。真实密钥与公网地址只能通过环境变量或外置 yml 注入。
collaboration:
  enabled: ${COLLABORATION_ENABLED:false}
  wps:
    app-id: ${WPS_WEBOFFICE_APP_ID:}
    app-secret: ${WPS_WEBOFFICE_APP_SECRET:}
    public-base-url: ${WPS_WEBOFFICE_PUBLIC_BASE_URL:}
    # 使用 WPS 控制台下载并部署的官方 web-office-sdk-solution.umd.js 地址。
    sdk-url: ${WPS_WEBOFFICE_SDK_URL:}
    endpoint: ${WPS_WEBOFFICE_ENDPOINT:https://o.wpsgo.com}
    token-secret: ${WPS_WEBOFFICE_TOKEN_SECRET:}
    token-minutes: ${WPS_WEBOFFICE_TOKEN_MINUTES:120}
    # 免费测试应用当前单文件限制为 5MB；正式授权后可通过外置配置调整。
    test-max-file-bytes: ${WPS_WEBOFFICE_TEST_MAX_FILE_BYTES:5242880}

# 电子导学单配置。密钥仅从部署环境注入，禁止写入表单数据。
guide-sheet:
  websocket:
    # 生产部署需通过环境变量列出页面的完整 Origin，禁止配置为 *。
    allowed-origins: ${GUIDE_SHEET_WS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://127.0.0.1,http://127.0.0.1:80}
  ai:
    provider: ${GUIDE_SHEET_AI_PROVIDER:deepseek}
    api-key: ${GUIDE_SHEET_AI_API_KEY:}
    model: ${GUIDE_SHEET_AI_MODEL:}
    base-url: ${GUIDE_SHEET_AI_BASE_URL:}
  teacher-helper:
    enabled: ${GUIDE_SHEET_HELPER_ENABLED:false}
    port: ${GUIDE_SHEET_HELPER_PORT:5000}
