# 数据源配置
spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        druid:
            # 主库数据源
            master:
                url: jdbc:mysql://localhost:3306/xueyeceping_server_20260729?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
                username: root
                password: 123456
            # 从库数据源
            slave:
                # 从数据源开关/默认关闭
                enabled: false
                url: 
                username: 
                password: 
            # 初始连接数与最小空闲数一致，避免上课突发流量临时创建连接
            initialSize: 20
            # 最小连接池数量
            minIdle: 20
            # 生产压测已确认 100 个连接全部占满；慢查询收口后小幅增加到 120
            # MySQL 当前 max_connections=151，仍为管理和运维连接保留 31 个名额
            maxActive: 120
            # 获取连接等待超时：过长会让前端一直挂起，30s 内失败便于快速重试/排障
            maxWait: 30000
            # 配置连接超时时间
            connectTimeout: 30000
            # 配置网络超时时间（业务 SQL 应远小于此值；LibreOffice 转换不占用 JDBC 连接）
            socketTimeout: 60000
            # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
            timeBetweenEvictionRunsMillis: 60000
            # 配置一个连接在池中最小生存的时间，单位是毫秒
            minEvictableIdleTimeMillis: 300000
            # 配置一个连接在池中最大生存的时间，单位是毫秒
            maxEvictableIdleTimeMillis: 900000
            # 配置检测连接是否有效qwe
            validationQuery: SELECT 1 FROM DUAL
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter: 
                enabled: ${DRUID_STAT_ENABLED:false}
            statViewServlet:
                enabled: ${DRUID_STAT_ENABLED:false}
                # 设置白名单，不填则允许所有访问
                allow:
                url-pattern: /druid/*
                # 控制台管理用户名和密码
                login-username: ruoyi
                login-password: 123456
            filter:
                stat:
                    enabled: true
                    # 慢SQL记录
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true
