<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选择题图片功能 · 本机真实页面</title>
<style>body{margin:0;background:#f3f5f8;color:#303133;font:14px/1.7 "Microsoft YaHei",sans-serif}header{background:white;border-bottom:1px solid #e4e7ed;padding:18px 28px}h1{font-size:21px;margin:0 0 4px}p{margin:0;color:#758092}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;padding:22px}nav{display:flex;flex-direction:column;gap:9px}button,a{font:inherit}button{padding:11px;text-align:left;border:1px solid #dce3ec;background:#fff;color:#606266;border-radius:5px;cursor:pointer}button[aria-current=true]{color:#337ecc;border-color:#8bc0f7;background:#edf5ff}main{min-width:0}main>p{margin-bottom:12px}img{max-width:100%;display:block;box-shadow:0 2px 8px #18263710;border:1px solid #e4e7ed}a{color:#337ecc;text-decoration:none}.hint{font-size:12px;margin-top:18px}@media(max-width:720px){.layout{grid-template-columns:1fr;padding:12px}nav{flex-direction:row;flex-wrap:wrap}button{padding:7px;font-size:12px}header{padding:14px}}</style>
<header><h1>选择题图片功能 · 真实页面验收</h1><p>增强方案 A · 2026-11-06 · 本机前后端与真实数据库，未部署</p></header>
<div class="layout"><nav id="nav" aria-label="页面选择"></nav><main><p id="caption"></p><a id="original" target="_blank" rel="noopener"><img id="shot" alt=""></a><p class="hint">点击截图查看原始尺寸。截图使用独立验收数据；临时题目、账号与成绩在验证后清理。实际界面仍支持纯文字题。</p></main></div>
<script>const pages=[['1-editor.png','教师录题','题干与选项保持文字输入，按需添加图片；支持上传、粘贴、拖拽、更换和删除。'],['2-bank.png','题库列表','含图题使用轻量标识，列表保持紧凑；查看详情时展示完整图片。'],['3-excel.png','Excel 图文导入','一次上传自动识别 50 题；预览中修正文字与图片后整批确认。'],['4-student.png','学生图文作答','流程图题干与图片选项同时展示；放大与选答案分开，评分规则保持。'],['5-designer.png','课程组卷','候选题、已选题和分值排序沿用原流程，图片题可展开预览。']];const nav=document.querySelector('#nav');pages.forEach((p,i)=>{const b=document.createElement('button');b.textContent=(i+1)+' · '+p[1];b.onclick=()=>show(i);nav.append(b)});function show(i){const p=pages[i];document.querySelector('#shot').src=p[0];document.querySelector('#shot').alt=p[1]+'真实页面截图';document.querySelector('#original').href=p[0];document.querySelector('#caption').textContent=p[2];[...nav.children].forEach((b,n)=>b.setAttribute('aria-current',n===i?'true':'false'))}show(0)</script></html>
